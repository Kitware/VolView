name: Server Tests
on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  merge_group:

jobs:
  server:
    runs-on: ubuntu-latest
    name: Server tests
    # a lost RPC result hangs the test instead of failing it
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install poetry
      - run: poetry install
      - run: poetry run pytest
